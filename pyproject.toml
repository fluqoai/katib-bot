[project]
name = "kateb"
version = "0.1.0"
description = "Telegram bot for Arabic official-correspondence drafting with Drive + Supabase RAG"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "ToolCan group" },
]
dependencies = [
    "fastapi>=0.115.4",
    "uvicorn[standard]>=0.32.0",
    "python-telegram-bot[ext]>=21.6",
    "supabase>=2.8.1",
    "httpx>=0.27.2",
    "aiohttp>=3.10.10",
    "google-api-python-client>=2.154.0",
    "google-auth>=2.35.0",
    "google-auth-oauthlib>=1.2.1",
    "google-auth-httplib2>=0.2.0",
    "openai>=1.55.0",
    "google-generativeai>=0.8.3",
    "python-docx>=1.1.2",
    "pymupdf>=1.24.13",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.1",
    "python-dotenv>=1.0.1",
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.2",
    "mypy>=1.13.0",
]

[project.scripts]
kateb-bot = "bot.main:main"
kateb-ingest = "scripts.ingest_drive:main"
kateb-init-db = "scripts.init_db:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bot", "rag", "drive", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: fast unit tests (no external services)",
    "integration: tests that need live Supabase / OpenAI / Drive",
]
